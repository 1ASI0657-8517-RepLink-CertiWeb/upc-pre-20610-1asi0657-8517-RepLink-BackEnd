events {
    worker_connections 1024;
}

http {
    client_max_body_size 15m;

    upstream certiweb_backend {
        server api:8080;
        server api2:8080;
    }

    server {
        listen 80;

        location /api/ {
            proxy_pass http://certiweb_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        location /health {
            proxy_pass http://certiweb_backend;
        }

        location /swagger/ {
            proxy_pass http://certiweb_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }
    }
}